name: 构建安卓 APK

# 手动触发，或当手机网页 / 安卓工程有改动时自动构建
on:
  workflow_dispatch:
  push:
    paths:
      - "public/**"
      - "app-android/**"
      - ".github/workflows/build-apk.yml"

# 让各 action 用 Node 24 运行，消除 GitHub 关于 Node 20 即将弃用的告警
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        working-directory: app-android
        run: npm install

      - name: 生成安卓原生工程
        working-directory: app-android
        run: npx cap add android

      - name: 同步网页资源
        working-directory: app-android
        run: npx cap sync android

      - name: 注入摄像头权限
        working-directory: app-android
        run: node scripts/patch-android.mjs

      - name: 编译 Debug APK
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: claude-remote-apk
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
